<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>태백: 쉬운여행, 쉬운인생</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap');
  :root {
    --red:#D0021B; --blue:#0047AB; --yellow:#F5C800; --black:#1A1A1A; --white:#FFFFFF;
    --b:4px solid #1A1A1A; --bt:6px solid #1A1A1A; --bx:10px solid #1A1A1A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',sans-serif;background:#e0e0e0;display:flex;justify-content:center;min-height:100vh;}
  #app{width:100%;max-width:430px;background:white;min-height:100vh;overflow-x:hidden;position:relative;}
  .screen{display:none;min-height:100vh;flex-direction:column;}
  .screen.active{display:flex;}
  /* SPLASH */
  .mhdr{display:grid;grid-template-columns:3fr 1fr 2fr;grid-template-rows:120px 60px 90px;border-bottom:var(--bx);height:270px;flex-shrink:0;}
  .mc{border:var(--b);} .mr{background:var(--red);} .mb{background:var(--blue);} .my{background:var(--yellow);} .mw{background:var(--white);} .mk{background:var(--black);}
  .sp-body{padding:28px 24px;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
  .sp-title{font-family:'Black Han Sans',sans-serif;font-size:44px;line-height:1.15;color:var(--black);}
  .sp-title span{color:var(--red);}
  .sp-desc{font-size:15px;line-height:1.7;color:#444;margin-top:16px;}
  .mstrip{display:flex;height:24px;margin-top:24px;}
  .mstrip div{flex:1;border:2px solid var(--black);}
  .start-btn{background:var(--black);color:white;font-family:'Black Han Sans',sans-serif;font-size:22px;border:none;padding:20px;width:100%;cursor:pointer;letter-spacing:2px;margin-top:24px;}
  .start-btn:active{background:var(--red);}
  /* LIST */
  .ltop{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:50px 24px;border-bottom:var(--bx);}
  .ltop-title{grid-column:1/4;display:flex;align-items:center;padding:0 16px;font-family:'Black Han Sans',sans-serif;font-size:22px;border-bottom:var(--b);gap:8px;}
  .dr{width:14px;height:14px;background:var(--red);border:2px solid var(--black);flex-shrink:0;}
  .db{width:14px;height:14px;background:var(--blue);border:2px solid var(--black);flex-shrink:0;}
  .lhdr{padding:12px 16px 8px;font-size:12px;color:#888;font-weight:500;border-bottom:2px solid #eee;}
  .lscroll{overflow-y:auto;flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;}
  .pcard{display:flex;border:var(--bt);border-radius:4px;overflow:hidden;cursor:pointer;min-height:110px;background:white;transition:transform .1s;}
  .pcard:active{transform:scale(.98);}
  .cimg{width:130px;min-width:130px;border-right:var(--b);overflow:hidden;}
  .cimg img{width:100%;height:100%;object-fit:cover;display:block;}
  .cinfo{padding:12px 14px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .cname{font-family:'Black Han Sans',sans-serif;font-size:17px;}
  .cdesc{font-size:12px;color:#555;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ctag{display:inline-block;border:2px solid var(--black);font-size:10px;font-weight:700;padding:2px 6px;width:fit-content;}
  .tr{background:var(--red);color:white;} .tb{background:var(--blue);color:white;} .ty{background:var(--yellow);color:var(--black);} .tk{background:var(--black);color:white;}
  /* DETAIL */
  #detail{overflow-y:auto;}
  .dtop{display:flex;align-items:center;border-bottom:var(--bx);position:sticky;top:0;background:white;z-index:10;height:56px;}
  .bbtn{width:56px;height:56px;border:none;border-right:var(--bt);background:var(--black);color:white;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bbtn:active{background:var(--red);}
  .dtitle{font-family:'Black Han Sans',sans-serif;font-size:17px;padding:0 12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ttsbtn{width:56px;height:56px;border:none;border-left:var(--bt);background:var(--yellow);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ttsbtn:active{background:var(--red);}
  .ttsbtn.spk{background:var(--red);animation:pulse .8s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .dhero{width:100%;height:240px;overflow:hidden;border-bottom:var(--bt);}
  .dhero img{width:100%;height:100%;object-fit:cover;display:block;}
  .mdiv{display:flex;height:10px;border-bottom:var(--b);}
  .mdiv .d1{flex:3;background:var(--red);border-right:var(--b);}
  .mdiv .d2{flex:1;background:var(--yellow);border-right:var(--b);}
  .mdiv .d3{flex:2;background:var(--blue);border-right:var(--b);}
  .mdiv .d4{flex:4;background:white;}
  .dsec{border-bottom:var(--bt);padding:20px 18px;}
  .slbl{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .slbox{width:14px;height:14px;border:2px solid var(--black);flex-shrink:0;}
  .stitle{font-family:'Black Han Sans',sans-serif;font-size:20px;}
  .pdesc{font-size:14px;line-height:1.8;color:#333;}
  .arow{display:flex;align-items:flex-start;gap:8px;padding:12px 0 0;border-top:2px solid var(--black);margin-top:14px;}
  .atxt{font-size:13px;color:#333;line-height:1.5;}
  .mapbox{background:#E8F4FD;border:var(--bt);height:160px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#666;font-size:13px;}
  .ilist{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .iitem{border:var(--b);padding:10px 12px;display:flex;flex-direction:column;gap:3px;}
  .iname{font-weight:700;font-size:14px;}
  .idet{font-size:12px;color:#555;}
  .idet a{color:var(--blue);text-decoration:none;font-weight:600;}
  .ptitem{border:var(--b);margin-bottom:12px;overflow:hidden;}
  .ptph{height:160px;display:flex;align-items:center;justify-content:center;font-size:50px;border-bottom:var(--b);background:#f5f5f5;}
  .ptbody{padding:12px 14px;}
  .ptn{font-family:'Black Han Sans',sans-serif;font-size:16px;margin-bottom:6px;}
  .ptd{font-size:13px;color:#444;line-height:1.7;}
  .rgrid{border:var(--bt);overflow:hidden;}
  .ritem{border-bottom:var(--b);}
  .ritem:last-child{border-bottom:none;}
  .rimg{height:130px;display:flex;align-items:center;justify-content:center;font-size:36px;background:#f5f5f5;border-bottom:var(--b);}
  .rbox{padding:12px 14px;}
  .rname{font-weight:700;font-size:15px;margin-bottom:4px;}
  .rdet{font-size:12px;color:#555;margin-top:2px;}
  .rdet a{color:var(--blue);font-weight:600;text-decoration:none;}
  .btabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-top:var(--bx);position:sticky;bottom:0;background:white;z-index:20;}
  .tbtn{padding:10px 4px;border:none;border-right:var(--b);background:white;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-family:'Noto Sans KR',sans-serif;font-weight:700;color:var(--black);}
  .tbtn:last-child{border-right:none;}
  .ticon{font-size:20px;}
  .tbtn.active{background:var(--black);color:white;}
  .tbtn:active{background:var(--red);color:white;}
  .sub{display:none;}
  .sub.active{display:block;}
  .sr .slbox{background:var(--red);} .sb .slbox{background:var(--blue);} .sy .slbox{background:var(--yellow);} .sk .slbox{background:var(--black);}
  .ttsbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--black);color:white;padding:10px 16px;display:none;align-items:center;gap:10px;z-index:100;border-top:var(--bt);font-size:13px;}
  .ttsbar.on{display:flex;}
  .ttsstop{margin-left:auto;background:var(--red);border:2px solid white;color:white;font-weight:700;font-size:12px;padding:4px 10px;cursor:pointer;white-space:nowrap;}
  ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:#f0f0f0;} ::-webkit-scrollbar-thumb{background:var(--black);}
</style>
</head>
<body>
<div id="app">

<!-- SPLASH -->
<div id="splash" class="screen active">
  <div class="mhdr">
    <div class="mc mr" style="grid-column:1;grid-row:1;"></div>
    <div class="mc mk" style="grid-column:2;grid-row:1;"></div>
    <div class="mc mw" style="grid-column:3;grid-row:1;"></div>
    <div class="mc mw" style="grid-column:1;grid-row:2;"></div>
    <div class="mc my" style="grid-column:2;grid-row:2;grid-row-end:4;"></div>
    <div class="mc mb" style="grid-column:3;grid-row:2;"></div>
    <div class="mc my" style="grid-column:1;grid-row:3;"></div>
    <div class="mc mr" style="grid-column:3;grid-row:3;"></div>
  </div>
  <div class="sp-body">
    <div>
      <div class="sp-title">태백:<br><span>쉬운여행,</span><br>쉬운인생</div>
      <p class="sp-desc">태백: 쉬운여행은 장애인, 노약자의 쉬운 여행을 위해 개발된 관광 도구입니다.</p>
      <div class="mstrip">
        <div style="background:var(--red);flex:3;"></div>
        <div style="background:var(--black);flex:1;"></div>
        <div style="background:var(--yellow);flex:2;"></div>
        <div style="background:var(--blue);flex:4;"></div>
        <div style="background:white;flex:2;"></div>
      </div>
    </div>
    <button class="start-btn" onclick="goList()">관광지 보러 가기 →</button>
  </div>
</div>

<!-- LIST -->
<div id="list" class="screen">
  <div class="ltop">
    <div class="mc mr" style="grid-column:1;"></div>
    <div class="mc my" style="grid-column:2;"></div>
    <div class="mc mb" style="grid-column:3;"></div>
    <div class="ltop-title"><div class="dr"></div>태백 관광지<div class="db"></div></div>
  </div>
  <div class="lhdr">총 6곳의 관광지 · 탭하여 상세 정보 확인</div>
  <div class="lscroll" id="listWrap"></div>
</div>

<!-- DETAIL -->
<div id="detail" class="screen">
  <div class="dtop">
    <button class="bbtn" onclick="goBack()">&#8592;</button>
    <div class="dtitle" id="dTopTitle">관광지</div>
    <button class="ttsbtn" id="ttsBtn" onclick="toggleTTS()">&#128266;</button>
  </div>
  <div id="sub0" class="sub active">
    <div class="dhero"><img id="heroImg" src="" alt=""/></div>
    <div class="mdiv"><div class="d1"></div><div class="d2"></div><div class="d3"></div><div class="d4"></div></div>
    <div class="dsec sr">
      <div class="slbl"><div class="slbox"></div><div class="stitle" id="dName"></div></div>
      <p class="pdesc" id="dDesc"></p>
      <div class="arow"><span style="font-size:18px;flex-shrink:0;">&#128205;</span><span class="atxt" id="dAddr"></span></div>
    </div>
    <div class="dsec sb">
      <div class="slbl"><div class="slbox"></div><div class="stitle">위치 안내</div></div>
      <div class="mapbox"><span style="font-size:40px;">&#128506;</span><span id="mapName"></span></div>
      <div style="margin-top:14px;">
        <div class="slbl" style="margin-bottom:8px;"><div class="slbox" style="background:var(--red);"></div><div style="font-weight:700;font-size:15px;">주변 병원</div></div>
        <div class="ilist" id="hospList"></div>
      </div>
    </div>
  </div>
  <div id="sub1" class="sub">
    <div class="dsec sy" style="border-top:var(--bt);">
      <div class="slbl"><div class="slbox"></div><div class="stitle">관광 포인트</div></div>
      <div id="ptList"></div>
    </div>
  </div>
  <div id="sub2" class="sub">
    <div class="dsec sk" style="border-top:var(--bt);">
      <div class="slbl"><div class="slbox"></div><div class="stitle">주변 식당</div></div>
      <div class="rgrid" id="restList"></div>
    </div>
  </div>
  <div class="btabs">
    <button class="tbtn active" id="t0" onclick="switchTab(0)"><span class="ticon">&#8505;&#65039;</span>기본정보</button>
    <button class="tbtn" id="t1" onclick="switchTab(1)"><span class="ticon">&#128248;</span>관광포인트</button>
    <button class="tbtn" id="t2" onclick="switchTab(2)"><span class="ticon">&#127869;&#65039;</span>주변식당</button>
    <button class="tbtn" id="t3" onclick="goList()"><span class="ticon">&#127968;</span>목록</button>
  </div>
</div>

<div class="ttsbar" id="ttsBar">
  <span>&#128266;</span>
  <span id="ttsTxt" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;"></span>
  <button class="ttsstop" onclick="stopTTS()">정지</button>
</div>
</div>

let cur=null, curTab=0, synth=window.speechSynthesis, speaking=false;

function renderList(){
  document.getElementById('listWrap').innerHTML=places.map(p=>`
    <div class="pcard" onclick="openDetail(${p.id})">
      <div class="cimg"><img src="${IMGS[p.imgKey]}" alt="${p.name}" loading="lazy"/></div>
      <div class="cinfo">
        <div class="ctag ${p.tc}">${p.tag}</div>
        <div class="cname">${p.name}</div>
        <div class="cdesc">${p.desc}</div>
      </div>
    </div>`).join('');
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goList(){stopTTS();show('list');}
function goBack(){stopTTS();goList();}

function openDetail(id){
  cur=places[id];
  show('detail');
  document.getElementById('detail').scrollTo(0,0);
  document.getElementById('dTopTitle').textContent=cur.name;
  document.getElementById('heroImg').src=IMGS[cur.imgKey];
  document.getElementById('heroImg').alt=cur.name;
  document.getElementById('dName').textContent=cur.name;
  document.getElementById('dDesc').textContent=cur.desc;
  document.getElementById('dAddr').textContent=cur.address;
  document.getElementById('mapName').textContent=cur.name+' 위치';
  document.getElementById('hospList').innerHTML=cur.hospitals.map(h=>`
    <div class="iitem">
      <div class="iname">&#127973; ${h.name}</div>
      <div class="idet">&#128205; ${h.addr}</div>
      <div class="idet">&#128222; <a href="tel:${h.tel}">${h.tel}</a></div>
    </div>`).join('');
  document.getElementById('ptList').innerHTML=cur.points.map(p=>`
    <div class="ptitem">
      <div class="ptph">${p.emoji}</div>
      <div class="ptbody"><div class="ptn">&#128204; ${p.name}</div><p class="ptd">${p.desc}</p></div>
    </div>`).join('');
  document.getElementById('restList').innerHTML=cur.restaurants.map(r=>`
    <div class="ritem">
      <div class="rimg">${r.e}</div>
      <div class="rbox">
        <div class="rname">${r.name}</div>
        <div class="rdet">&#128205; ${r.addr}</div>
        <div class="rdet">&#128222; <a href="tel:${r.tel}">${r.tel}</a></div>
      </div>
    </div>`).join('');
  switchTab(0);
}

function switchTab(i){
  curTab=i;
  ['sub0','sub1','sub2'].forEach((id,j)=>document.getElementById(id).classList.toggle('active',j===i));
  for(let j=0;j<3;j++)document.getElementById('t'+j).classList.toggle('active',j===i);
  document.getElementById('detail').scrollTo(0,56);
}

function getTTSTxt(){
  if(!cur)return'';
  if(curTab===0)return cur.name+'. '+cur.desc+' 주소: '+cur.address+'. 주변 병원: '+cur.hospitals.map(h=>h.name+', 전화 '+h.tel).join('. ');
  if(curTab===1)return '관광 포인트. '+cur.points.map(p=>p.name+'. '+p.desc).join(' 다음. ');
  if(curTab===2)return '주변 식당. '+cur.restaurants.map(r=>r.name+', 전화 '+r.tel).join('. ');
  return'';
}
function toggleTTS(){speaking?stopTTS():startTTS();}
function startTTS(){
  if(!synth)return; stopTTS();
  const txt=getTTSTxt(); if(!txt)return;
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='ko-KR'; u.rate=0.88;
  u.onstart=()=>{speaking=true;document.getElementById('ttsBtn').classList.add('spk');document.getElementById('ttsBar').classList.add('on');document.getElementById('ttsTxt').textContent=txt;};
  const end=()=>{speaking=false;document.getElementById('ttsBtn').classList.remove('spk');document.getElementById('ttsBar').classList.remove('on');};
  u.onend=end; u.onerror=end; synth.speak(u);
}
function stopTTS(){if(synth)synth.cancel();speaking=false;document.getElementById('ttsBtn').classList.remove('spk');document.getElementById('ttsBar').classList.remove('on');}

renderList();
</script>
